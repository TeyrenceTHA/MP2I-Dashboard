name: Mise à jour des colles de maths

on:
  schedule:
    - cron: "0 13 * * 6"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-maths:
    runs-on: ubuntu-latest

    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4

      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Installer les dépendances
        run: pip install requests beautifulsoup4

      - name: Récupérer les programmes
        run: python scripts/update_maths.py

      - name: Enregistrer les changements
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add programmes/maths/
          if git diff --cached --quiet; then
            echo "Aucun nouveau programme."
          else
            git commit -m "Mise à jour des colles de maths"
            git push
          fi