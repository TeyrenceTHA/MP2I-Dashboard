</head>

<body>

<aside class="sidebar">

    <div class="logo">
        <div class="logo-icon">M</div>

        <div>
            <strong>MP2I</strong>
            <span>Dashboard</span>
        </div>
    </div>

    <nav>

        <a href="index.html">
            <span>⌂</span>
            Accueil
        </a>

        <a href="kholle.html">
            <span>◈</span>
            Khôlles
        </a>

        <a class="active" href="revisions.html">
            <span>◫</span>
            Révisions
        </a>

        <a href="cours.html">
            <span>▣</span>
            Cours
        </a>

        <a href="ds.html">
            <span>▤</span>
            DS
        </a>

    </nav>

    <div class="sidebar-bottom">

        <a href="#" id="settingsButton">
            <span>⚙</span>
            Paramètres
        </a>

    </div>

</aside>


<main>

    <header class="topbar">

        <div>

            <p class="eyebrow">
                RÉVISIONS
            </p>

            <h1>
                Informatique
            </h1>

        </div>


        <div class="profile">

            <div class="avatar">
                Y
            </div>

            <span>
                You
            </span>

        </div>

    </header>


    <div class="section-header">

        <div>

            <p class="eyebrow">
                NOTEBOOKS
            </p>

            <h2>
                Mes notebooks d'informatique
            </h2>

        </div>


        <button
            class="mini-button"
            id="addNotebook"
        >
            + Ajouter un notebook
        </button>

    </div>


    <section
        id="notebookGrid"
        class="grid"
    ></section>


    <div
        id="themePanel"
        class="theme-panel glass"
    >

        <p class="eyebrow">
            APPARENCE
        </p>

        <h3>
            Thème
        </h3>


        <div class="theme-buttons">

            <button onclick="setTheme('purple')">

                <span class="theme-dot purple"></span>

                Violet

            </button>


            <button onclick="setTheme('red')">

                <span class="theme-dot red"></span>

                Rouge

            </button>


            <button onclick="setTheme('green')">

                <span class="theme-dot green"></span>

                Vert

            </button>

        </div>

    </div>


    <footer>
        MP2I Dashboard · 2026
    </footer>

</main>


<script src="script.js"></script>


<script>

const storageKey =
    "mp2i-info-notebooks";


let notebooks =
    JSON.parse(
        localStorage.getItem(storageKey)
    ) || [];


// ================================
// SAUVEGARDER
// ================================

function saveNotebooks() {

    localStorage.setItem(
        storageKey,
        JSON.stringify(notebooks)
    );

}


// ================================
// AFFICHER LES NOTEBOOKS
// ================================

function displayNotebooks() {

    const grid =
        document.getElementById(
            "notebookGrid"
        );

    grid.innerHTML = "";


    if (notebooks.length === 0) {

        grid.innerHTML = `

            <div class="loading-card glass">

                Aucun notebook pour le moment.

                <br><br>

                Utilise
                <strong>+ Ajouter un notebook</strong>
                pour en créer un.

            </div>

        `;

        return;

    }


    notebooks.forEach(
        (notebook, index) => {

            const card =
                document.createElement("div");

            card.className =
                "dashboard-card glass";


            card.innerHTML = `

                <div class="card-icon">
                    &lt;/&gt;
                </div>


                <div>

                    <h3>
                        ${notebook.name}
                    </h3>


                    <p>
                        Notebook de révision
                    </p>


                    <div class="course-buttons">

                        <a
                            class="mini-button"
                            href="${notebook.url}"
                            target="_blank"
                            rel="noopener noreferrer"
                        >
                            Ouvrir →
                        </a>

                    </div>

                </div>

            `;


            grid.appendChild(card);

        }
    );

}


// ================================
// AJOUTER UN NOTEBOOK
// ================================

document
    .getElementById("addNotebook")
    .addEventListener(
        "click",
        function() {

            const name =
                prompt(
                    "Nom du notebook :"
                );


            if (!name) {
                return;
            }


            const url =
                prompt(
                    "Lien du notebook :"
                );


            if (!url) {
                return;
            }


            notebooks.push({

                name: name.trim(),

                url: url.trim()

            });


            saveNotebooks();

            displayNotebooks();

        }
    );


// ================================
// INITIALISATION
// ================================

displayNotebooks();

</script>

</body>
</html>
