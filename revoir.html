<main>

    <header class="topbar">

        <div>

            <p class="eyebrow">

            </p>

        </div>


        <div class="profile">

            </div>

            </span>

    <section class="welcome glass">

        <div>

            </p>

    </footer>

<script src="script.js"></script>


<script>

// ================================
// STOCKAGE
// ================================

const storageKey =
    "mp2i-revisions";


let revisions =
    JSON.parse(
        localStorage.getItem(storageKey)
    ) || [];


// ================================
// SAUVEGARDER
// ================================

function saveRevisions() {

    localStorage.setItem(
        storageKey,
        JSON.stringify(revisions)
    );

}


// ================================
// AFFICHER
// ================================

function displayRevisions() {

    const list =
        document.getElementById(
            "revisionList"
        );


    list.innerHTML = "";


    if (revisions.length === 0) {

        list.innerHTML = `

            <div class="loading-card glass">

                Aucune notion à revoir.

                <br><br>

                Utilise
                <strong>+ Ajouter</strong>
                pour créer ta première notion.

            </div>

        `;

        return;

    }


    revisions.forEach(
        (revision, index) => {

            const card =
                document.createElement(
                    "div"
                );


            card.className =
                "revision-card glass";


            card.innerHTML = `

                <div class="revision-main">

                    <div class="revision-priority priority-${revision.priority}">
                    </div>


                    <div>

                        <h3>
                            ${revision.title}
                        </h3>

                        <p>
                            ${revision.subject}
                        </p>

                    </div>

                </div>


                <div class="revision-actions">

                    ${
                        revision.url
                        ?
                        `
                        <a
                            href="${revision.url}"
                            target="_blank"
                            rel="noopener noreferrer"
                            class="mini-button"
                        >
                            Ouvrir →
                        </a>
                        `
                        :
                        ""
                    }


                    <button
                        class="mini-button"
                        onclick="markDone(${index})"
                    >
                        ✓ Maîtrisé
                    </button>


                    <button
                        class="mini-button"
                        onclick="deleteRevision(${index})"
                    >
                        Supprimer
                    </button>

                </div>

            `;


            list.appendChild(card);

        }
    );

}


// ================================
// AJOUTER
// ================================

document
    .getElementById("addRevision")
    .addEventListener(
        "click",
        function() {

            const title =
                prompt(
                    "Nom de la notion :"
                );


            if (!title) return;


            const subject =
                prompt(
                    "Matière :"
                );


            if (!subject) return;


            const priority =
                prompt(
                    "Priorité :\n\n" +
                    "1 = Haute\n" +
                    "2 = Moyenne\n" +
                    "3 = Faible"
                ) || "2";


            const url =
                prompt(
                    "Lien vers le cours ou le notebook (optionnel) :"
                );


            revisions.push({

                title:
                    title.trim(),

                subject:
                    subject.trim(),

                priority:
                    priority.trim(),

                url:
                    url
                    ? url.trim()
                    : ""

            });


            saveRevisions();

            displayRevisions();

        }
    );


// ================================
// MAÎTRISÉ
// ================================

function markDone(index) {

    revisions.splice(
        index,
        1
    );


    saveRevisions();

    displayRevisions();

}


// ================================
// SUPPRIMER
// ================================

function deleteRevision(index) {

    if (
        !confirm(
            "Supprimer cette notion ?"
        )
    ) {
        return;
    }


    revisions.splice(
        index,
        1
    );


    saveRevisions();

    displayRevisions();

}


// ================================
// INITIALISATION
// ================================

displayRevisions();

</script>
<script src="activity.js?v=4"></script>
