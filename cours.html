<body>

```

<main class="main-content">

    <div class="section-header">
        <h1>Cours</h1>
        <p>Retrouvez les cours et TD de mathématiques.</p>
    </div>


    <section>

        <div class="section-header">
            <h2>Chapitres</h2>
        </div>

            <div class="glass loading-card">
                Chargement des cours...
            </div>

        </div>

    </section>

</main>


<div id="themePanel" class="theme-panel glass">

    <h3>Thème</h3>

    <button onclick="setTheme('purple')">
        <span class="theme-dot purple"></span>
        Violet
    </button>

    <button onclick="setTheme('red')">
        <span class="theme-dot red"></span>
        Rouge
    </button>

    <button onclick="setTheme('green')">
        <span class="theme-dot green"></span>
        Vert
    </button>

</div>


<script>

    const settingsButton =
        document.getElementById("settingsButton");

    const themePanel =
        document.getElementById("themePanel");


    if (settingsButton && themePanel) {

        settingsButton.addEventListener(
            "click",
            function(event) {

                event.preventDefault();

                themePanel.classList.toggle("show");

            }
        );

    }


    function setTheme(theme) {

        document.body.classList.remove(
            "theme-purple",
            "theme-red",
            "theme-green"
        );

        document.body.classList.add(
            "theme-" + theme
        );

        localStorage.setItem(
            "theme",
            theme
        );

    }


    const savedTheme =
        localStorage.getItem("theme") || "purple";

    setTheme(savedTheme);


    /*
     * CHARGEMENT DES COURS
     */

    const container =
        document.getElementById("cours-container");


    fetch("programmes/cours/cours.json")

        .then(response => {

            if (!response.ok) {

                throw new Error(
                    "cours.json introuvable"
                );

            }

            return response.json();

        })

        .then(data => {

            container.innerHTML = "";


            if (
                !data.programmes ||
                data.programmes.length === 0
            ) {

                container.innerHTML = `
                    <div class="glass loading-card">
                        Aucun cours disponible.
                    </div>
                `;

                return;

            }


            /*
             * Regrouper les documents
             * par chapitre
             */

            const chapitres = {};


            data.programmes.forEach(
                document => {

                    const chapitre =
                        document.chapitre;

                    if (!chapitres[chapitre]) {

                        chapitres[chapitre] = {};

                    }

                    chapitres[chapitre][
                        document.type
                    ] = document.url;

                }
            );


            /*
             * Trier les chapitres
             */

            const liste =
                Object.keys(chapitres)
                .sort(
                    (a, b) => {

                        const numA =
                            parseInt(
                                a.replace("ch", "")
                            );

                        const numB =
                            parseInt(
                                b.replace("ch", "")
                            );

                        return numA - numB;

                    }
                );


            /*
             * Créer les cartes
             */

            liste.forEach(
                chapitre => {

                    const numero =
                        parseInt(
                            chapitre.replace("ch", "")
                        );


                    const card =
                        document.createElement("div");

                    card.className =
                        "dashboard-card glass";


                    card.innerHTML = `

                        <div class="card-icon">
                            ${numero}
                        </div>

                        <div class="card-content">

                            <h3>
                                Chapitre ${numero}
                            </h3>

                            <div class="course-buttons">

                                ${
                                    chapitres[chapitre].cours
                                    ?
                                    `
                                    <a
                                        class="mini-button"
                                        href="programmes/cours/${chapitres[chapitre].cours}"
                                        target="_blank"
                                    >
                                        Cours
                                    </a>
                                    `
                                    :
                                    ""
                                }

                                ${
                                    chapitres[chapitre].td
                                    ?
                                    `
                                    <a
                                        class="mini-button"
                                        href="programmes/cours/${chapitres[chapitre].td}"
                                        target="_blank"
                                    >
                                        TD
                                    </a>
                                    `
                                    :
                                    ""
                                }

                            </div>

                        </div>

                    `;


                    container.appendChild(card);

                }
            );

        })

        .catch(error => {

            console.error(error);

            container.innerHTML = `

                <div class="glass loading-card">

                    Impossible de charger
                    les cours.

                </div>

            `;

        });

</script>
```
