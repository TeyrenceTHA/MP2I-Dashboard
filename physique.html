        <div class="logo-icon">M</div>
        <div>
            <strong>MP2I</strong>
            <span>Dashboard</span>
        </div>
    </div>

    <nav>
        <a href="index.html"><span>⌂</span>Accueil</a>
        <a href="kholle.html"><span>◈</span>Khôlles</a>
        <a href="revoir.html"><span>!</span>À revoir</a>
        <a class="active" href="revisions.html"><span>◫</span>Révisions</a>
        <a href="cours.html"><span>▣</span>Cours</a>
        <a href="ds.html"><span>▤</span>DS</a>
        <a href="#" id="settingsButton">
            <span>⚙</span>
            Paramètres
        </a>
    </nav>



</aside>

<main>

<header class="topbar">

    <div>
        <p class="eyebrow">RÉVISIONS</p>
        <h1>Physique</h1>
    </div>

    <div class="profile">
        <div class="avatar">Y</div>
        <span>You</span>
    </div>

</header>

<div class="section-header">

    <div>
        <p class="eyebrow">NOTEBOOKS</p>
        <h2>Mes notebooks de physique</h2>
    </div>

    <button class="mini-button" id="addNotebook">
        + Ajouter un notebook
    </button>

</div>

<section id="notebookGrid" class="grid"></section>

<div id="themePanel" class="theme-panel glass">

    <p class="eyebrow">APPARENCE</p>
    <h3>Thème</h3>

    <div class="theme-buttons">

        <button onclick="setTheme('purple')">
            <span class="theme-dot purple"></span>
            Violet
        </button>

        <button onclick="setTheme('red')">
            <span class="theme-dot red"></span>
            Rouge
        </button>

        <button onclick="setTheme('green')">
            <span class="theme-dot green"></span>
            Vert
        </button>

    </div>

</div>

<footer>
    MP2I Dashboard · 2026
</footer>

</main>

<script src="script.js"></script>

<script>

const storageKey = "mp2i-physique-notebooks";

let notebooks =
    JSON.parse(localStorage.getItem(storageKey)) || [];

function saveNotebooks() {

    localStorage.setItem(
        storageKey,
        JSON.stringify(notebooks)
    );

}

function displayNotebooks() {

    const grid =
        document.getElementById("notebookGrid");

    grid.innerHTML = "";

    notebooks.forEach(notebook => {

        const card =
            document.createElement("div");

        card.className =
            "dashboard-card glass";

        card.innerHTML = `

            <div class="card-icon">🤖</div>

            <div>

                <h3>${notebook.name}</h3>

                <p>Notebook de révision</p>

                <div class="course-buttons">

                    <a
                        class="mini-button"
                        href="${notebook.url}"
                        target="_blank"
                    >
                        Ouvrir →
                    </a>

                </div>

            </div>

        `;

        grid.appendChild(card);

    });

}

document
    .getElementById("addNotebook")
    .addEventListener("click", function() {

        const name =
            prompt("Nom du notebook :");

        if (!name) return;

        const url =
            prompt("Lien du notebook :");

        if (!url) return;

        notebooks.push({
            name: name,
            url: url
        });

        saveNotebooks();
        displayNotebooks();

    });

displayNotebooks();

</script>
<script src="activity.js?v=4"></script>
</body>
</html>
