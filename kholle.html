<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Khôlles — MP2I</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <aside class="sidebar">

        <div class="logo">
            <div class="logo-icon">M</div>

            <div>
                <strong>MP2I</strong>
                <span>Dashboard</span>
            </div>
        </div>

        <nav>

            <a href="index.html">
                <span>⌂</span>
                Accueil
            </a>

            <a class="active" href="kholle.html">
                <span>◈</span>
                Khôlles
            </a>

            <a href="revisions.html">
                <span>◫</span>
                Révisions
            </a>

            <a href="cours.html">
                <span>▣</span>
                Cours
            </a>

            <a href="ds.html">
                <span>▤</span>
                DS
            </a>

        </nav>

        <div class="sidebar-bottom">

            <a href="index.html">
                <span>←</span>
                Retour
            </a>

        </div>

    </aside>


    <main>

        <header class="topbar">

            <div>

                <p class="eyebrow">ESPACE PERSONNEL</p>

                <h1>Khôlles</h1>

            </div>

            <div class="profile">

                <div class="avatar">D</div>

                <span>Dieu</span>

            </div>

        </header>


        <section class="welcome glass">

            <div>

                <p class="eyebrow">PROGRAMMES</p>

                <h2>Programmes de khôlles</h2>

                <p class="muted">
                    Les programmes de maths sont récupérés automatiquement.
                </p>

            </div>

            <div class="status">

                <span></span>
                Maths

            </div>

        </section>


        <section>

            <div class="section-header">

                <p class="eyebrow">MATHÉMATIQUES</p>

                <h2>Programmes disponibles</h2>

            </div>


            <div id="programmes" class="grid">

                <div class="glass loading-card">
                    Chargement des programmes...
                </div>

            </div>

        </section>


        <footer>
            MP2I Dashboard · 2026
        </footer>

    </main>


    <script>

        const container = document.getElementById("programmes");


        fetch("programmes/maths/maths.json")

            .then(response => {

                if (!response.ok) {
                    throw new Error("Impossible de récupérer les programmes.");
                }

                return response.json();

            })

            .then(data => {

                container.innerHTML = "";

                if (!data.programmes || data.programmes.length === 0) {

                    container.innerHTML = `
                        <div class="glass loading-card">
                            Aucun programme disponible.
                        </div>
                    `;

                    return;

                }


                data.programmes.forEach(programme => {

                    const card = document.createElement("a");

                    card.className = "dashboard-card glass";

                    card.href =
                        "programmes/maths/" + programme.fichier;

                    card.target = "_blank";


                    card.innerHTML = `

                        <div class="card-icon">◈</div>

                        <div>

                            <h3>${programme.semaine}</h3>

                            <p>${programme.titre}</p>

                        </div>

                        <span class="arrow">→</span>

                    `;


                    container.appendChild(card);

                });

            })

            .catch(error => {

                console.error(error);

                container.innerHTML = `

                    <div class="glass loading-card">

                        Impossible de charger les programmes.

                    </div>

                `;

            });

    </script>

</body>

</html>
